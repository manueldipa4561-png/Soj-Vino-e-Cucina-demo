<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#dfe8df">
  <title>Pagina non trovata — Sój</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#dfe8df;color:#171a18;font-family:Arial,Helvetica,sans-serif;padding:24px}.wrap{width:min(920px,100%);border:1px solid #171a18;background:#fcfcf7;padding:clamp(28px,6vw,72px);position:relative;overflow:hidden}.code{font:700 11px 'Courier New',monospace;letter-spacing:.12em}.big{font-size:clamp(110px,24vw,260px);line-height:.7;letter-spacing:-.09em;font-weight:900;margin:45px 0 28px;color:#e55d2d}.wrap h1{font-size:clamp(34px,5vw,64px);line-height:.95;letter-spacing:-.05em;margin:0 0 18px}.wrap p{font-size:17px;max-width:560px}.wrap a{display:inline-flex;margin-top:20px;padding:13px 18px;background:#171a18;color:#fff;text-decoration:none;font-weight:800;font-size:12px}.dot{position:absolute;width:120px;height:120px;border:2px solid #171a18;border-radius:50%;right:-35px;top:36px;background:#dfe8df}@media(max-width:520px){.dot{width:78px;height:78px}.wrap{padding:28px 22px}.big{margin-top:60px}}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="dot" aria-hidden="true"></div>
    <p class="code">SÓJ / ERRORE 404</p>
    <div class="big">404</div>
    <h1>Questo tavolo<br>non esiste.</h1>
    <p>La pagina che stai cercando non è qui. Torna alla sala principale.</p>
    <a href="/">Torna a Sój</a>
  </main>
</body>
</html>
